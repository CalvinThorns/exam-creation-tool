name: autogenex

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------
  # 1. API GATEWAY 
  # ----------------------------------------
  gateway:
    image: nginx:1.29-alpine
    container_name: autogenex-gateway
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      - "80:80" 
    depends_on:
      frontend:
        condition: service_healthy
      task-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - app-network

  # ----------------------------------------
  # 2. FRONTEND (React / Vite)
  # ----------------------------------------
  frontend:
    image: autogenex/frontend:local
    container_name: autogenex-frontend
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    build: 
      context: ./frontend-web-ui
      args:
        VITE_API_URL: /api
        VITE_EXAMS_API_URL: /api/exams
        VITE_TASKS_API_URL: /api
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - app-network

  # ----------------------------------------
  # 3. TASK SERVICE (Courses & Topics)
  # ----------------------------------------
  task-service:
    image: autogenex/task-service:local
    container_name: autogenex-task-service
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    build: 
      context: ./task-service
    ports:
      - "3001:3001"
    expose:
      - "3001"
    networks:
      - app-network
    environment:
      PORT: "3001"
      MONGO_URI: mongodb://autogenex-mongodb:27017/autogenex
      JWT_SECRET: "super_secret"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', (r) => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ----------------------------------------
  # 4. EXAM SERVICE 
  # ----------------------------------------
  exam-service:
    image: autogenex/exam-service:local
    container_name: autogenex-exam-service
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    build: 
      context: ./exam-service
    ports:
      - "3000:3000"
    expose:
      - "3000"
    environment:
      MONGO_URI: mongodb://autogenex-mongodb:27017/autogenex
      PORT: "3000"
      CLSI_URL: http://autogenex-clsi:3013
      CLSI_HTTP_TIMEOUT_MS: "900000"
      API_INTERNAL_BASE_URL: http://autogenex-exam-service:3000
      JWT_SECRET: "super_secret"
    depends_on:
      mongodb:
        condition: service_healthy
      clsi:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - app-network
  # ----------------------------------------
  # 5. AUTH SERVICE (User Management)
  # ----------------------------------------
  auth-service:
    image: autogenex/auth-service:local
    container_name: autogenex-auth-service
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    build: 
      context: ./auth-service
    ports:
      - "3002:3002"
    expose:
      - "3002"
    environment:
      PORT: "3002"
      MONGO_URI: mongodb://autogenex-mongodb:27017/autogenex
      JWT_SECRET: "super_secret"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health', (r) => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - app-network

  # ----------------------------------------
  # 6. OVERLEAF CLSI (LaTeX Compiler)
  # ----------------------------------------
  clsi:
    image: autogenex/clsi:local
    build:
      context: ./clsi
      dockerfile: Dockerfile
    container_name: autogenex-clsi
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "3013:3013"
    environment:
      LISTEN_ADDRESS: "0.0.0.0"
      DOCKER_RUNNER: "false"
      TEXLIVE_IMAGE: "texlive/texlive:latest"
      ALLOWED_IMAGES: "texlive/texlive:latest"
      TEXLIVE_IMAGE_USER: "root"
      COMPILES_HOST_DIR: ${PWD}/compiles
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./compiles:/overleaf/services/clsi/compiles
      - ./cache:/overleaf/services/clsi/cache
    logging: *default-logging
    networks:
      - app-network

  # ----------------------------------------
  # 7. DATENBANK (MongoDB)
  # ----------------------------------------
  mongodb:
    image: mongo:8.0
    container_name: autogenex-mongodb
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "27017:27017" 
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging: *default-logging
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data: