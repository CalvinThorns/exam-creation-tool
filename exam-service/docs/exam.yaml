openapi: 3.0.3
info:
  title: Exam API
  version: 1.1.0
  description: Exam generation and management service.

tags:
  - name: Exams
    description: Endpoints for exam generation, compilation, and CRUD.

paths:
  /api/exams:
    get:
      summary: List exams
      tags: [Exams]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: sort
          schema:
            type: string
          description: Comma-separated field:direction values, e.g. createdAt:desc,points:asc
        - in: query
          name: filter
          schema:
            type: string
          description: Repeated field:op:value filter (eq, ne, lt, lte, gt, gte, in, nin, regex)
      responses:
        "200":
          description: Exams list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ExamDto"
                      meta:
                        allOf:
                          - $ref: "#/components/schemas/ResponseMeta"
                          - $ref: "#/components/schemas/PaginationMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create exam
      tags: [Exams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExamDto"
      responses:
        "201":
          description: Exam created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExamDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/exams/{id}:
    get:
      summary: Get exam by id
      tags: [Exams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Exam details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExamDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update exam by id
      tags: [Exams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExamDto"
      responses:
        "200":
          description: Exam updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExamDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: Delete exam by id
      tags: [Exams]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/exams/draft:
    post:
      summary: Generate draft exam topics
      tags: [Exams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDraftRequestDto"
      responses:
        "200":
          description: Draft generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DraftResultDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/exams/draft/regenerate-topic:
    post:
      summary: Regenerate a single draft topic variant
      tags: [Exams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateDraftTopicRequestDto"
      responses:
        "200":
          description: Topic regenerated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DraftResultDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/exams/draft/compile:
    post:
      summary: Compile generated draft to PDF
      tags: [Exams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileDraftRequestDto"
      responses:
        "200":
          description: Draft compiled, PDF returned as base64
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CompileResultDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/exams/compile-latex:
    post:
      summary: Compile raw latex to PDF
      tags: [Exams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latexContent]
              properties:
                latexContent:
                  type: string
      responses:
        "200":
          description: Latex compiled, PDF returned as base64
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CompileResultDto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/exams/latex-template/base:
    get:
      summary: Get base latex template
      tags: [Exams]
      responses:
        "200":
          description: Template retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          template:
                            type: string
                          placeholder:
                            type: string
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      summary: Update base latex template
      tags: [Exams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template:
                  type: string
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          template:
                            type: string
                          placeholder:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadGateway:
      description: Upstream service failure (e.g. CLSI)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ResponseMeta:
      type: object
      required: [timestamp, status]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          minimum: 100
          maximum: 599
        requestId:
          type: string
          nullable: true
        path:
          type: string
          nullable: true
        method:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean

    SuccessEnvelope:
      type: object
      required: [success, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          nullable: true
          description: Endpoint-specific payload
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    ErrorIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        field:
          type: string
          nullable: true
        kind:
          type: string
          nullable: true
        details:
          nullable: true

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
        details:
          nullable: true
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ErrorIssue"
        errors:
          description: Legacy alias of issues
          type: array
          items:
            $ref: "#/components/schemas/ErrorIssue"

    ErrorEnvelope:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    CompileDiagnosticError:
      type: object
      properties:
        message:
          type: string
        line:
          type: integer
          nullable: true
        snippet:
          type: string
          nullable: true

    CompileDiagnosticWarning:
      type: object
      properties:
        where:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        message:
          type: string

    CompileDiagnostics:
      type: object
      required: [outcome, errorCount, warningCount, errors, warnings]
      properties:
        outcome:
          type: string
          enum: [success, success_with_warnings, success_with_errors]
        clsiStatus:
          type: string
          nullable: true
        buildId:
          type: string
          nullable: true
        stats:
          type: object
          additionalProperties: true
        timings:
          type: object
          additionalProperties: true
        errorCount:
          type: integer
        warningCount:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/CompileDiagnosticError"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CompileDiagnosticWarning"
        log:
          type: string
          nullable: true
        stdout:
          type: string
          nullable: true
        stderr:
          type: string
          nullable: true

    CompileResultDto:
      type: object
      required: [filename, contentType, pdfBase64]
      properties:
        filename:
          type: string
        contentType:
          type: string
          example: application/pdf
        pdfBase64:
          type: string
        diagnostics:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CompileDiagnostics"
        errors:
          description: Legacy alias of diagnostics
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CompileDiagnostics"

    TaskDto:
      type: object
      properties:
        id:
          type: string
          nullable: true
        question:
          type: string
        points:
          type: number
          minimum: 0
        solution:
          type: string
        solutionSpace:
          type: string
        isRelatedToTopic:
          type: boolean

    DraftTopicDto:
      type: object
      properties:
        topicId:
          type: string
          nullable: true
        courseId:
          type: string
          nullable: true
        topic:
          type: string
        description:
          type: string
        points:
          type: number
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskDto"

    CourseSnapshotDto:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        shortName:
          type: string
        coverPage:
          type: string

    DraftResultDto:
      type: object
      properties:
        course:
          $ref: "#/components/schemas/CourseSnapshotDto"
        topicNames:
          type: array
          items:
            type: string
        targetPoints:
          type: number
        totalPoints:
          type: number
        diff:
          type: number
        topics:
          type: array
          items:
            $ref: "#/components/schemas/DraftTopicDto"

    ExamDto:
      type: object
      properties:
        id:
          type: string
        courseId:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/CourseSnapshotDto"
        targetPoints:
          type: number
        points:
          type: number
        topics:
          type: array
          items:
            $ref: "#/components/schemas/DraftTopicDto"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateExamDto:
      type: object
      required: [courseId, targetPoints, topics]
      properties:
        courseId:
          type: string
        targetPoints:
          type: number
          minimum: 1
        topics:
          type: array
          items:
            $ref: "#/components/schemas/DraftTopicDto"

    UpdateExamDto:
      type: object
      properties:
        courseId:
          type: string
        targetPoints:
          type: number
          minimum: 1
        points:
          type: number
          minimum: 0
        topics:
          type: array
          items:
            $ref: "#/components/schemas/DraftTopicDto"

    GenerateDraftRequestDto:
      type: object
      required: [courseId, topics, targetPoints]
      properties:
        courseId:
          type: string
        topics:
          type: array
          items:
            type: string
        targetPoints:
          type: number
          minimum: 1

    RegenerateDraftTopicRequestDto:
      type: object
      required: [courseId, topicName, targetPoints, currentDraftTopics]
      properties:
        courseId:
          type: string
        topicName:
          type: string
        targetPoints:
          type: number
          minimum: 1
        currentDraftTopics:
          type: array
          items:
            $ref: "#/components/schemas/DraftTopicDto"

    CompileDraftRequestDto:
      type: object
      required: [courseId, topics]
      properties:
        courseId:
          type: string
        course:
          $ref: "#/components/schemas/CourseSnapshotDto"
        coverPage:
          type: string
        version:
          type: string
          enum: [STUDENT, TEACHER]
          default: STUDENT
        topics:
          type: array
          items:
            $ref: "#/components/schemas/DraftTopicDto"
